# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=medigrid-backend

# H2 Database In-Memory Configuration (Accessible for zero-config startup)
spring.datasource.url=jdbc:h2:mem:medigriddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.medigrid=DEBUG
logging.level.org.springframework.web=INFO
